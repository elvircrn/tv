[package]
name = "trace-viewer-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
trace-viewer = { path = ".." }

[workspace]
members = ["."]

[[bin]]
name = "fuzz_json_parser"
path = "fuzz_targets/fuzz_json_parser.rs"
doc = false

[[bin]]
name = "fuzz_skip_primitives"
path = "fuzz_targets/fuzz_skip_primitives.rs"
doc = false

[[bin]]
name = "fuzz_json_unescape"
path = "fuzz_targets/fuzz_json_unescape.rs"
doc = false
