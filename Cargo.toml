[package]
name = "trace-viewer"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "tv"
path = "src/main.rs"

[lib]
name = "trace_viewer"
path = "src/lib.rs"

[dependencies]
imgui = { version = "0.12", features = ["tables-api"] }
winit = { version = "0.30", default-features = false, features = ["rwh_06"] }
raw-window-handle = "0.6"
memchr = "2"
tar = "0.4"
rayon = "1"

# Enabled only by scripts/build-wasm-mt.sh / serve-wasm-mt.sh, the
# atomics/bulk-memory nightly build that gets real Web Worker parallelism —
# see the wasm-bindgen-rayon dependency comment below for why it must be
# strictly opt-in rather than always-on for wasm32.
[features]
mt = ["dep:wasm-bindgen-rayon"]

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
imgui-sys = { version = "0.12", features = ["freetype"] }
metal = "0.33"
raw-window-metal = "1"
core-graphics-types = "0.2"
flate2 = { version = "1", features = ["zlib-ng"], default-features = false }
libdeflater = "1"
memmap2 = "0.9"
# Used only by loader::export_gpu_only's .tvcache.xz output — measured
# directly against a real 87MB args blob: xz gets ~265x vs gzip's ~65x
# (see that function's doc comment), which is why this isn't flate2/gzip.
xz2 = "0.1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
# Plain imgui-sys (stb_truetype rasterizer, no freetype) — freetype needs a
# C toolchain/sysroot for the target, and wasm doesn't read the SF Mono font
# from disk anyway (see renderer_web.rs: DefaultFontData).
imgui-sys = "0.12"
flate2 = { version = "1", features = ["rust_backend"], default-features = false }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
# Real Web Worker-backed rayon parallelism — only for the atomics/bulk-memory
# nightly build (scripts/build-wasm-mt.sh / serve-wasm-mt.sh). Must be
# `optional` (gated behind the `mt` feature below, only turned on by those
# scripts) rather than an unconditional wasm32 dependency: the crate has a
# hard `compile_error!` that fires for *any* wasm32 compile lacking
# `target_feature = "atomics"`, which would otherwise break the plain
# stable-toolchain build (scripts/build-wasm.sh) the moment this dependency
# entered the graph at all, whether or not any of its items were reachable.
# `no-bundler`: Trunk serves generated JS/wasm as static files with no
# webpack/vite-style import-rewriting pass, which the default "bundler" JS
# snippet's `new URL('./workerHelpers.js', import.meta.url)` Worker
# construction depends on to resolve; the `no-bundler` variant instead
# `fetch`es its own script text via `import.meta.url` and spawns the Worker
# from a blob URL, which works under plain static hosting.
wasm-bindgen-rayon = { version = "1.3", optional = true, features = ["no-bundler"] }
# rayon's default lock implementation calls `std::thread::park`, which wasm32
# threads *can* do once atomics are enabled (Workers can block on
# `Atomics.wait`) — except the main thread, which browsers forbid from
# blocking that way. `web_spin_lock` swaps rayon's internal locks for a
# spin-loop instead, avoiding that deadlock. Scoped to wasm32 only (via this
# target-specific re-declaration; Cargo's resolver-v2 feature unification
# keeps it out of the native build's feature set) since native's real OS
# threads have no such restriction and spinning would just waste cycles.
rayon = { version = "1", features = ["web_spin_lock"] }
js-sys = "0.3"
web-time = "1"
console_error_panic_hook = "0.1"
web-sys = { version = "0.3", features = [
    "HtmlCanvasElement", "WebGl2RenderingContext", "WebGlProgram", "WebGlShader",
    "WebGlBuffer", "WebGlTexture", "WebGlUniformLocation", "WebGlVertexArrayObject",
    "File", "FileList", "FileReader", "DataTransfer", "DragEvent", "Blob", "Event",
    "Clipboard", "ClipboardEvent", "DataTransferItem", "DataTransferItemList",
    "FileSystemEntry", "FileSystemDirectoryEntry", "FileSystemDirectoryReader", "FileSystemFileEntry",
    "Navigator", "Performance", "HtmlInputElement", "Window", "Document", "Element",
] }

[profile.dev-release]
inherits = "release"
opt-level = 2
lto = false
strip = false
codegen-units = 16
incremental = true

[profile.release]
opt-level = 3
lto = "thin"
strip = true
codegen-units = 4
